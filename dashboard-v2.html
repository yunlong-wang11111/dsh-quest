<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quest 控制台 v2</title>
<style>
  :root { --bg:#0f1216; --card:#171c23; --line:#252c36; --fg:#d8dee6; --dim:#7c8794;
          --ok:#3fb96f; --run:#4a9eff; --bad:#e0563f; --warn:#d9a038; --acc:#7c5cff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:13px/1.55 "Segoe UI",system-ui,sans-serif; padding:12px; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px; }
  h1 { font-size:16px; font-weight:600; margin-right:auto; }
  h1 small { color:var(--dim); font-weight:400; margin-left:8px; font-size:12px; }
  nav { display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; }
  nav button { background:var(--card); border:1px solid var(--line); color:var(--dim); padding:6px 13px; border-radius:8px; cursor:pointer; font-size:13px; }
  nav button.on { color:var(--fg); border-color:var(--acc); background:#1c2130; }
  section { display:none; } section.on { display:block; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:9px; }
  select, input[type=text], button.act { background:#0b0e12; border:1px solid var(--line); color:var(--fg); border-radius:7px; padding:5px 9px; font-size:12px; }
  button.act { cursor:pointer; } button.act:hover { border-color:var(--acc); }
  button.act.danger:hover { border-color:var(--bad); color:var(--bad); }
  button.act:disabled { opacity:.4; cursor:default; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:6px 7px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  .st { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  .st.completed{background:var(--ok)} .st.running{background:var(--run);animation:p 1s infinite alternate}
  .st.failed,.st.timeout{background:var(--bad)} .st.cancelled{background:var(--dim)}
  .st.pending,.st.frozen,.st.skipped,.st.ready{background:var(--warn)}
  @keyframes p { to{opacity:.3} }
  .mut { color:var(--dim); }
  .mono { font-family:ui-monospace,Consolas,monospace; }
  pre { background:#0b0e12; border:1px solid var(--line); border-radius:8px; padding:9px; overflow:auto; max-height:56vh; white-space:pre-wrap; font-size:11.5px; }
  .gate-item { border:1px solid var(--line); border-radius:9px; padding:10px; margin-bottom:8px; }
  .gate-item code { display:block; background:#0b0e12; padding:6px 8px; border-radius:7px; margin:6px 0; font-size:11.5px; word-break:break-all; }
  .pill { display:inline-block; padding:1px 7px; border-radius:20px; font-size:11px; border:1px solid var(--line); color:var(--dim); }
  .spark { vertical-align:middle; }
  #tokbar { position:fixed; right:12px; bottom:12px; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:9px; display:flex; gap:6px; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:16px; background:#1c2130; border:1px solid var(--acc); border-radius:8px; padding:8px 14px; font-size:12.5px; display:none; }
  /* ── 任务线追踪（魔兽任务追踪器式的约定：进行中在最上、已完成灰掉打勾并默认收起） ── */
  .trk-hd { display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:5px; }
  .trk-hd b { font-size:13.5px; }
  #trkState { border-color:var(--acc); color:var(--fg); }
  #trkState.busy { border-color:var(--run); color:#bcd9ff; }
  #trkState.quiet { border-color:var(--ok); color:#bff0d0; }
  #trkState.bad { border-color:var(--bad); color:#ffc4b8; }
  #trkList { display:grid; gap:1px; margin-top:2px; }
  .obj { display:flex; gap:7px; align-items:center; padding:3px 6px; border-radius:6px; }
  .obj:hover { background:#1b2129; }
  .obj .oi { flex:0 0 16px; text-align:center; }
  .obj .oid { flex:0 1 auto; max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .obj .ostat { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--dim); font-size:12px; }
  .obj.done { opacity:.5; }
  .obj.done .oi { color:var(--ok); }
  .obj.run .oi { color:var(--run); animation:p 1s infinite alternate; }
  .obj.run .ostat { color:#9dc6ff; }
  .obj.bad .oi, .obj.bad .ostat { color:var(--bad); }
  .obj.warn .oi, .obj.warn .ostat { color:var(--warn); }
  .trk-grp { margin:7px 0 1px; color:var(--dim); font-size:11.5px; }
  .trk-more { color:var(--dim); font-size:11.5px; padding:2px 0 2px 23px; }
  /* ── 任务链路线图（BTWQuests 式约定：依赖箭头、完成打绿勾、可派发绿框、人工门金星）横排 ── */
  .rm-hd { display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:7px; }
  .rm-hd b { font-size:13.5px; }
  .rm-wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; background:#0b0e12; padding:10px; max-height:62vh; }
  .rm-canvas { position:relative; }
  .rm-node { position:absolute; width:186px; height:44px; background:var(--card); border:1px solid var(--line);
             border-radius:8px; padding:4px 8px; font-size:12px; overflow:hidden; cursor:pointer; }
  .rm-node:hover { border-color:var(--acc); }
  .rm-node .rid { font-family:ui-monospace,Consolas,monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; }
  .rm-node .rst { color:var(--dim); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; }
  .rm-node.done { border-color:#2b5c3f; } .rm-node.done .rst { color:var(--ok); }
  .rm-node.run { border-color:var(--run); animation:p 1s infinite alternate; } .rm-node.run .rst { color:#9dc6ff; }
  .rm-node.bad { border-color:#6d2f24; } .rm-node.bad .rst { color:var(--bad); }
  .rm-node.warn { border-color:#6b5320; } .rm-node.warn .rst { color:var(--warn); }
  .rm-node.dim { opacity:.6; }
  .rm-node.frontier { border-color:var(--ok); box-shadow:0 0 0 2px rgba(63,185,111,.25); }
  .rm-check { position:absolute; right:5px; bottom:3px; color:var(--ok); font-size:12px; }
  .rm-crest { position:absolute; left:5px; bottom:3px; color:var(--warn); font-size:11px; }
  .rm-time { position:absolute; right:5px; top:3px; color:#5f6b7a; font-size:10px; }
  .rm-legend { color:var(--dim); font-size:11.5px; margin-top:7px; line-height:1.7; }
</style>
</head>
<body>
<header>
  <h1>quest 控制台 <small id="ver"></small></h1>
  <span class="pill" id="live">● 实时</span>
  <select id="ws" style="max-width:340px"></select>
  <span class="mut" id="wsmeta"></span>
  <span style="flex:1"></span>
  <button class="act" id="gateTop" style="display:none" onclick="document.getElementById('gate').scrollIntoView({behavior:'smooth'})">门禁 <b id="gateN"></b></button>
  <button class="act" onclick="refreshAll()">刷新</button>
</header>
<nav>
  <button data-t="tasks" class="on">任务线</button>
  <button data-t="logs">日志</button>
  <button data-t="files">文件</button>
</nav>

<section id="tasks" class="on">
  <!-- ① 状态：一眼看出"在改代码 / 在跑 / 静默" -->
  <div class="card" id="trk">
    <div class="trk-hd">
      <b>当前状态</b>
      <span class="pill" id="trkState">读取中…</span>
      <span class="mut" id="trkCount"></span>
    </div>
    <div class="mut" id="trkWhy"></div>
  </div>

  <!-- ② 正在跑：**所有**在跑的节点（plan + 快速单发都在这里，回答"现在在跑什么"） -->
  <div class="card" id="running" style="margin-top:10px">
    <div class="trk-hd"><b>正在跑</b><span class="mut" id="runCount"></span></div>
    <div id="runList"></div>
  </div>

  <!-- ③ 计划路线：只画 plan.md 声明的节点（快速单发不在图里，见上方「正在跑」） -->
  <div class="card" style="margin-top:10px">
    <div class="rm-hd">
      <b>计划路线</b>
      <span class="mut" id="rmCount"></span>
      <span style="flex:1"></span>
      <button class="act" onclick="renderRoute(lastStatus)">重画</button>
    </div>
    <div class="mut" id="rmWhy" style="margin-bottom:8px"></div>
    <div class="rm-wrap"><div class="rm-canvas" id="rmCanvas"></div></div>
    <div class="rm-legend">
      图例：✔ 完成（盒右下角绿勾）· ✖ 失败 · ▶ 运行中 · ⛔ 冻结 · ⏭ 跳过 · ○ 待办 · ★ 人工门（manual: true）·
      <b style="color:var(--ok)">绿框 = 现在可派发</b>（前置都已完成）· 点节点 → 看它的日志 ·
      <b>实线</b>箭头 = 相邻列的依赖 · <b>虚线</b>箭头 = <b style="color:#9dc6ff">跳级依赖</b>（after 跨 ≥2 列，从盒子区外侧绕行）·
      箭头颜色：绿=上游已完成，红=上游失败/冻结，灰=待办
    </div>
  </div>

  <!-- ④ 全部节点（含操作按钮） -->
  <div class="card" style="margin-top:10px">
    <div class="row">
      <span class="mut">全部节点明细（plan + 快速单发，按 进行中→异常→待办→已完成 排）</span>
    </div>
    <table>
      <thead><tr><th>节点</th><th>状态</th><th>判定</th><th>耗时</th><th>指标</th><th>操作</th></tr></thead>
      <tbody id="nodes"></tbody>
    </table>
  </div>

  <!-- ⑤ 门禁：只在有挂起命令时出现 -->
  <div class="card" id="gate" style="margin-top:10px;display:none">
    <div class="trk-hd"><b>门禁（待确认的命令）</b></div>
    <div id="gateBody"></div>
  </div>
</section>

<section id="gate">
  <div class="card" id="gateBody"><span class="mut">加载中…</span></div>
</section>

<section id="logs">
  <div class="card">
    <div class="row">
      <select id="logNode"></select>
      <button class="act" onclick="loadLog()">读取</button>
      <label class="mut"><input type="checkbox" id="logAuto" checked> 运行中自动刷新</label>
      <span class="mut" id="logMeta"></span>
    </div>
    <div id="sparkWrap"></div>
    <pre id="logText">选择一个节点…</pre>
  </div>
</section>

<section id="files">
  <div class="card">
    <div class="row">
      <input type="text" id="fpath" style="flex:1;min-width:240px" placeholder="绝对路径（Windows 或 \\wsl$\Ubuntu\...）">
      <button class="act" onclick="go($('#fpath').value)">前往</button>
      <button class="act" onclick="go(wslHome())">WSL 家目录</button>
    </div>
    <table><tbody id="flist"></tbody></table>
    <div id="viewer"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let TOKEN = new URLSearchParams(location.search).get('token') || localStorage.getItem('questTok') || '';
function showTokbar() {
  if (document.getElementById('tokbar')) return;
  const b = document.createElement('div'); b.id = 'tokbar';
  b.innerHTML = '<input id="tokin" placeholder="quest token（~/.dsh/quests/.token）"><button class="act" onclick="saveTok()">保存</button>';
  document.body.appendChild(b);
}
function saveTok() {
  TOKEN = (document.getElementById('tokin').value || '').trim();
  localStorage.setItem('questTok', TOKEN);
  document.getElementById('tokbar').remove();
  refreshAll();
}
if (!TOKEN) showTokbar();

async function api(path, opt) {
  const r = await fetch(path, { ...(opt || {}), headers: { 'x-quest-token': TOKEN, ...((opt && opt.headers) || {}) } });
  if (r.status === 401) { showTokbar(); throw new Error('token 无效'); }
  const txt = await r.text();
  let j; try { j = JSON.parse(txt); } catch { j = { raw: txt.slice(0, 300) }; }
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
const post = (p, body) => api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const fmtSize = (n) => n > 1048576 ? (n/1048576).toFixed(1)+'MB' : n > 1024 ? (n/1024).toFixed(0)+'KB' : n+'B';
const wslHome = () => '\\\\wsl$\\Ubuntu\\home\\solanine';
// 注意：wslhint 那个元素在合并页面时删掉了——**删元素必须同时删引用**，否则顶层赋值抛异常会
// 静默中断整个脚本（页面全空、只显示"读取中…"）。这类"删了元素忘了引用"踩过一次，留个记号。
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2600); }

let curWs = '';
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('nav button').forEach((x) => x.classList.remove('on'));
  document.querySelectorAll('section').forEach((x) => x.classList.remove('on'));
  b.classList.add('on'); $('#' + b.dataset.t).classList.add('on');
  if (b.dataset.t === 'gate') loadGate();
  if (b.dataset.t === 'logs') fillLogNodes();
});

async function loadWs() {
  const d = await api('/api/workspaces');
  const sel = $('#ws'); sel.innerHTML = '';
  for (const w of d.workspaces) {
    const o = document.createElement('option');
    o.value = w.wsKey; o.textContent = (w.running ? '▶ ' : '') + (w.title || w.wsKey);
    sel.appendChild(o);
  }
  // ?ws= 允许写路径（用户/AI 更习惯写路径）——转成 wsKey 再匹配；匹配不上就报出来，别静默空白
  const q = new URLSearchParams(location.search).get('ws');
  if (q) {
    const asKey = String(q).replace(/^([A-Za-z]):[\\/]/, '$1-').replace(/[\\/]+/g, '-').replace(/-+$/, '');
    const hit = [...sel.options].find((o) => o.value === q || o.value === asKey);
    if (hit) sel.value = hit.value;
    else {
      $('#wsmeta').textContent = `⚠️ ?ws= 没匹配上任何工作区（${q}）——已切到列表第一个；下拉里是 wsKey`;
      console.warn('[quest] ?ws= 未匹配：', q, '候选：', [...sel.options].map((o) => o.value).join(', '));
    }
  }
  curWs = sel.value;
  sel.onchange = () => { curWs = sel.value; loadTasks(); fillLogNodes(); };
}

let nodesCache = [];
async function loadTasks() {
  if (!curWs) { // 没选到工作区：说清楚，别一直"读取中…"（静默空白最难查）

    const t2 = $('#trkState'); if (t2) { t2.textContent = '没有选中工作区'; t2.className = 'pill bad'; }
    return;
  }
  const d = await api('/api/status?ws=' + encodeURIComponent(curWs));
  $('#ver').textContent = d.questVersion || '';
  $('#wsmeta').textContent = d.plan?.workspace || '';
  nodesCache = d.plan?.nodes || [];
  lastStatus = d;
  renderTracker(d);
  renderRunning(d);
  renderRoute(d);
  loadGate();
  $('#nodes').innerHTML = nodesCache.map((n) => {
    const canDispatch = ['failed','timeout','cancelled','pending','skipped','ready','frozen'].includes(n.status);
    const canCancel = n.status === 'running';
    const resumable = n.status === 'failed' && (n.interrupted || n.verdict === 'suspect' || n.verdict === 'crashed' || n.verdict === 'timeout');
    return `<tr>
      <td class="mono">${esc(n.id)}</td>
      <td><span class="st ${esc(n.status)}"></span>${esc(n.status)}</td>
      <td>${esc(n.verdict || '')}${n.via ? ' <span class="mut">' + esc(n.via) + '</span>' : ''}</td>
      <td>${n.runSeconds != null ? Math.round(n.runSeconds/60) + '分' : ''}</td>
      <td>${n.metrics?.loss_last != null ? 'loss ' + esc(n.metrics.loss_last) + (n.metrics.loss_slope_10ep != null ? ' · 斜率 ' + esc(n.metrics.loss_slope_10ep) : '') : ''}</td>
      <td>
        ${canDispatch ? `<button class="act" onclick="act('dispatch','${esc(n.id)}')">派发</button> ` : ''}
        ${canCancel ? `<button class="act danger" onclick="act('cancel','${esc(n.id)}')">终止</button> ` : ''}
        ${resumable ? `<button class="act" onclick="act('resume','${esc(n.id)}')">续跑</button> ` : ''}
        <button class="act" onclick="openLog('${esc(n.id)}')">日志</button>
      </td>
    </tr>`;
  }).join('');
  if (!$('#logs').classList.contains('on')) return;
}

// ── 任务线追踪（一眼看出：子对话在改代码 / 任务在跑 / 真收敛）──────────────
// 约定借自魔兽的任务追踪器：进行中在最上、已完成灰掉打勾并默认收起、标题栏带 x/y 计数。
let lastStatus = null;

const TRK_ICON = { completed:'✔', failed:'✖', timeout:'⏱', cancelled:'⛔', frozen:'🔒', skipped:'⏭', ready:'⏸', running:'▶', pending:'○' };
const TRK_CLS  = { completed:'done', failed:'bad', timeout:'bad', cancelled:'bad', frozen:'bad', skipped:'warn', ready:'warn', running:'run', pending:'' };
const TRK_TXT  = { completed:'完成', failed:'失败', timeout:'超时', cancelled:'已终止', frozen:'冻结(等人工)', skipped:'跳过(when 不成立)', ready:'就绪(等人工派发)', running:'运行中', pending:'待办' };
/** 工作区级状态：这是"看不见子对话在干嘛"的正解——它在改代码 / 在跑会话 / 真收敛，都写在这。 */
function trkStateText(line) {
  if (!line) return { t: '（没有状态信息）', cls: '' };
  const ago = (m) => (m == null ? '' : m < 1 ? `${Math.round(m * 60)} 秒前` : `${Math.round(m)} 分钟前`);
  if (line.dsh?.running) return { t: `子对话正在工作（${line.dsh.running} 个会话在跑）`, cls: 'busy' };
  const ws = line.workspace;
  if (ws?.recent) return { t: `正在改代码（最近 ${ws.windowMinutes} 分钟改了 ${ws.recent} 个文件，最新 ${ws.latest?.name || '?'}）`, cls: 'busy' };
  if (line.active) return { t: `${line.active} 个任务在跑`, cls: 'busy' };
  if (line.quiet) return { t: '静默（收敛）', cls: 'quiet' };
  return { t: `刚有动作（${ago(line.idleMinutes)}）· 还没到静默窗口（${line.quietMinutes} 分钟）`, cls: '' };
}
/** 节点最近一次动作时间（用于把最新发生的排在最上——WoW 追踪器也是把当前目标放最前）。 */
function nodeAt(n) { return Date.parse(n.completedAt || n.startedAt || '') || 0; }
function renderTracker(d) {   // 瘦身成「当前状态」卡：徽章 + 计数 + 最新 + 依据
  if (!d) return;
  const nodes = d.plan?.nodes || [];
  const line = d.line || {};
  const st = trkStateText(line);
  const el = $("#trkState");
  if (el) { el.textContent = st.t; el.className = "pill " + st.cls; }
  const c = line.counts || {};
  const done = c.completed ?? nodes.filter((n) => n.status === "completed").length;
  const running = nodes.filter((n) => n.status === "running").length;
  if ($("#trkCount")) $("#trkCount").textContent = `共 ${line.nodes ?? nodes.length} 个节点：完成 ${done}`
    + (running ? ` · 在跑 ${running}` : "")
    + (c.failed ? ` · 失败 ${c.failed}` : "") + (c.frozen ? ` · 冻结 ${c.frozen}` : "")
    + (c.cancelled ? ` · 终止 ${c.cancelled}` : "");
  const newest = nodes.filter((n) => nodeAt(n)).sort((a, b) => nodeAt(b) - nodeAt(a))[0];
  const newestLine = newest
    ? `最新：${newest.id} · ${TRK_TXT[newest.status] || newest.status}${newest.verdict ? "（" + newest.verdict + "）" : ""}`
    : "";
  if ($("#trkWhy")) $("#trkWhy").textContent = [
    newestLine,
    line.quiet ? `判据：无在跑节点 · 最近动作 ${line.idleMinutes ?? "-"} 分钟前 · 工作区 ${line.workspace ? (line.workspace.recent ? "有改动" : "无改动") : "未知"} · 子对话 ${line.dsh ? (line.dsh.running ? "在跑" : "空闲") : "未知"}` : "",
  ].filter(Boolean).join(" ｜ ");
}

// ── 正在跑：**所有**在跑的节点（plan 与快速单发都在这里）——回答"我现在在跑什么" ──
function renderRunning(d) {
  if (!d) return;
  const nodes = d.plan?.nodes || [];
  const run = nodes.filter((n) => n.status === "running");
  if ($("#runCount")) $("#runCount").textContent = run.length ? `${run.length} 个` : "（没有）";
  const box = $("#runList");
  if (!box) return;
  if (!run.length) { box.innerHTML = String.raw`<div class="mut">现在没有在跑的任务。</div>`; return; }
  box.innerHTML = run.sort((a, b) => nodeAt(b) - nodeAt(a)).map((n) => {
    const secs = n.startedAt ? Math.max(0, Math.round((Date.now() - Date.parse(n.startedAt)) / 1000)) : n.runSeconds;
    const started = n.startedAt ? new Date(n.startedAt).toLocaleTimeString("zh-CN", { hour12: false }).slice(0, 5) : "";
    return `<div class="obj run">
      <span class="oi">▶</span>
      <span class="oid mono" title="${esc(n.id)}">${esc(n.id)}</span>
      <span class="ostat">${n.inPlan ? "plan 节点" : "快速单发"}${n.shell === "wsl" ? " · WSL 车道" : " · Windows 车道"} · 已跑 ${secs != null ? Math.floor(secs / 60) + "分" + (secs % 60) + "秒" : "?"}${started ? " · 起于 " + started : ""}${n.expectedMinutes ? "" : ""}</span>
      <button class="act" onclick="openLog('${esc(n.id)}')">日志</button>
      <button class="act danger" onclick="act('cancel','${esc(n.id)}')">终止</button>
    </div>`;
  }).join("");
}

// ── 任务链路线图（横排；BTWQuests 式：依赖箭头 + 完成绿勾 + 可派发绿框 + 人工门金星）──
// 只画 plan.md 声明的节点（快速单发不在图里）：回答"当下 plan 走到哪了"。
// 布局：深度 = 最长前置链（Kahn 拓扑层次，带环保护）；同列按声明顺序。
function renderRoute(d) {
  if (!d) return;
  const all = d.plan?.nodes || [];
  const plan = all.filter((n) => n.inPlan);
  const byId = new Map(all.map((n) => [n.id, n]));
  const line = d.line || {};
  const c = {};
  for (const n of plan) c[n.status] = (c[n.status] ?? 0) + 1;
  const depsOf = (n) => (n.after || []).filter((a) => byId.has(a));
  const frontier = plan.filter((n) => ['pending', 'ready'].includes(n.status) && depsOf(n).every((a) => byId.get(a)?.status === 'completed'));
  if ($('#rmCount')) {
    $('#rmCount').textContent = plan.length
      ? `plan 节点 ${plan.length}｜完成 ${c.completed || 0} · 运行 ${c.running || 0} · 可派发 ${frontier.length} · 异常 ${(c.failed || 0) + (c.timeout || 0) + (c.frozen || 0) + (c.cancelled || 0)}`
      : '没有 plan.md 节点';
  }
  const quick = all.filter((n) => !n.inPlan);
  const quickRunning = quick.filter((n) => n.status === 'running');
  const serverHasPlanMeta = all.length > 0 && ('inPlan' in (all[0] || {}));
  const planAllDone = plan.length > 0 && plan.every((n) => ['completed', 'failed', 'frozen', 'cancelled', 'skipped', 'timeout'].includes(n.status));
  const lastPlanAct = plan.length ? Math.max(0, ...plan.map((n) => nodeAt(n))) : 0;   // 这份 plan 最近一次动作（改"看着像没动"）
  if ($('#rmWhy')) {
    $('#rmWhy').textContent = plan.length
      ? `图里只有 plan.md 声明的 ${plan.length} 个节点`
        + (quick.length ? `；另有 ${quick.length} 个快速单发不在图里` + (quickRunning.length ? `（其中 ${quickRunning.length} 个正在跑，见上方「正在跑」）` : '') : '')
        + (planAllDone && quickRunning.length ? ' —— 图里是历史状态，今天在跑的是快速单发，所以不在路线图上' : '')
        + (lastPlanAct ? `。这份 plan 最近一次动作是 ${Math.round((Date.now() - lastPlanAct) / 3600000) >= 1 ? Math.round((Date.now() - lastPlanAct) / 3600000) + ' 小时' : '刚刚'}前` : '')
      : (!serverHasPlanMeta
        ? '⚠️ 当前 quest 服务是旧版（/api/status 还没有 inPlan/after 字段）——重启 quest 后路线图就能读到 plan 的依赖关系了'
        : `这个工作区还没有 plan.md（历史都是快速单发 ${quick.length} 个）——用下方明细看它们；想让路线图有内容，就让 AI 写一份 plan.md 把流水固定下来`);
  }
  const canvas = $('#rmCanvas');
  if (!canvas) return;
  if (!plan.length) { canvas.innerHTML = ''; canvas.style.height = '40px'; return; }

  const depth = new Map();
  const calc = (id, seen) => {
    if (depth.has(id)) return depth.get(id);
    const deps = depsOf(byId.get(id));
    if (!deps.length || seen.has(id)) { depth.set(id, 0); return 0; }
    seen.add(id);
    const d2 = 1 + Math.max(...deps.map((p) => calc(p, seen)));
    depth.set(id, d2); return d2;
  };
  for (const n of plan) calc(n.id, new Set());
  const cols = new Map();
  for (const n of plan) { const dp = depth.get(n.id) || 0; if (!cols.has(dp)) cols.set(dp, []); cols.get(dp).push(n); }

  const NW = 186, NH = 44, GX = 68, GY = 16, PAD = 10, LANE = 16;
  // 同列行序：按"父节点所在行的重心"排（Sugiyama 第二步，减少交叉）。跑两遍足够这个规模。
  for (let pass = 0; pass < 2; pass++) {
    const rowOf = new Map();
    for (const [dp, list] of [...cols.entries()].sort((a, b) => a[0] - b[0])) list.forEach((n, i) => rowOf.set(n.id, i));
    for (const [dp, list] of [...cols.entries()].sort((a, b) => a[0] - b[0])) {
      if (dp === 0) continue; // 根列保持声明顺序
      const key = (n) => {
        const ps = depsOf(n).filter((a) => rowOf.has(a));
        return ps.length ? ps.reduce((s, a) => s + rowOf.get(a), 0) / ps.length : -1; // 无前置的排最上
      };
      const withIdx = list.map((n, i) => ({ n, i, k: key(n) }));
      withIdx.sort((a, b) => (a.k - b.k) || (a.i - b.i));
      cols.set(dp, withIdx.map((x) => x.n));
    }
  }
  const pos = new Map();
  let maxX = 0, maxY = 0;
  for (const [dp, list] of cols) {
    list.forEach((n, i) => {
      const x = PAD + dp * (NW + GX);
      const y = PAD + LANE + i * (NH + GY); // 上方留出跳级边的"车道"
      pos.set(n.id, { x, y });
      maxX = Math.max(maxX, x + NW); maxY = Math.max(maxY, y + NH);
    });
  }
  const W = maxX + PAD, H = maxY + LANE + PAD; // 下方也留一条车道
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

  // 箭头：绿=上游完成，红=上游失败/冻结，灰=其它
  const edgeColor = (p) => (p.status === 'completed' ? '#3fb96f' : ['failed', 'timeout', 'frozen'].includes(p.status) ? '#e0563f' : '#3a4350');
  const paths = [];
  for (const n of plan) {
    for (const a of depsOf(n)) {
      const p = byId.get(a), pp = pos.get(a), cp = pos.get(n.id);
      if (!pp || !cp) continue;
      const x1 = pp.x + NW, y1 = pp.y + NH / 2, x2 = cp.x - 6, y2 = cp.y + NH / 2;
      const col = edgeColor(p);
      const gap = (depth.get(n.id) || 0) - (depth.get(a) || 0);
      if (gap >= 2) {
        // **跳级边（跨 ≥2 列）走正交"车道"**：横向段在上下留白里（盒子区之外），
        // 两个竖直转折都落在列间隙（18px，绝无盒子）——几何上不可能穿过任何盒子。
        const laneY = y2 < y1 ? PAD + LANE / 2 : H - LANE / 2;
        paths.push(`<path d="M ${x1} ${y1} H ${x1 + 18} V ${laneY} H ${x2 - 18} V ${y2} H ${x2}" fill="none" stroke="${col}" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arm-${col.slice(1)})"/>`);
      } else {
        paths.push(`<path d="M ${x1} ${y1} C ${x1 + 34} ${y1}, ${x2 - 34} ${y2}, ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="1.6" marker-end="url(#arm-${col.slice(1)})"/>`);
      }
    }
  }
  const markers = ['#3fb96f', '#e0563f', '#3a4350'].map((col) => `<marker id="arm-${col.slice(1)}" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${col}"/></marker>`).join('');
  const boxes = plan.map((n) => {
    const p = pos.get(n.id);
    const cls = [TRK_CLS[n.status] || '', frontier.includes(n) ? 'frontier' : ''].filter(Boolean).join(' ');
    const bits = [];
    if (n.status === 'running') {
      const secs = n.startedAt ? Math.round((Date.now() - Date.parse(n.startedAt)) / 1000) : n.runSeconds;
      if (secs != null) bits.push(`已跑 ${Math.floor(secs / 60)}分${secs % 60}秒`);
    } else {
      if (n.verdict) bits.push(n.verdict);
      if (n.runSeconds != null) bits.push(`${Math.round(n.runSeconds / 60)}分`);
    }
    if (n.metrics?.loss_last != null) bits.push(`loss ${n.metrics.loss_last}`);
    if (n.shell === 'wsl') bits.push('wsl');
    return `<div class="rm-node ${cls}" style="left:${p.x}px;top:${p.y}px" title="${esc(n.id)}&#10;${esc((n.after || []).join(', ') || '（链头）')}&#10;${esc(n.success || '')}" onclick="openLog('${esc(n.id)}')">
      <div class="rid">${TRK_ICON[n.status] || '·'} ${esc(n.id)}</div>
      <div class="rst">${esc(TRK_TXT[n.status] || n.status)}${bits.length ? ' · ' + esc(bits.join(' · ')) : ''}</div>
      ${n.status === 'completed' ? '<span class="rm-check">✔</span>' : ''}
      ${nodeAt(n) ? `<span class="rm-time" title="最后一次动作">${new Date(nodeAt(n)).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).replace(/\//g, '-')}</span>` : ''}
      ${n.manual ? '<span class="rm-crest" title="人工门：上游完成后停下等确认">★</span>' : ''}
    </div>`;
  }).join('');
  canvas.innerHTML = `<svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;pointer-events:none"><defs>${markers}</defs>${paths.join('')}</svg>${boxes}`;
}

async function act(kind, node) {  try {
    if (kind === 'dispatch') {
      if (!confirm(`派发节点「${node}」？\n\n会立即在后台执行，完成后通知。`)) return;
      const r = await post('/api/dispatch?ws=' + encodeURIComponent(curWs), { node });
      toast(r.ok ? `已派发 ${node}` : `失败：${r.error}`);
    } else if (kind === 'cancel') {
      const why = prompt(`终止「${node}」——会杀整棵进程树，并记为 cancelled（不触发自动修复）。\n\n原因（可留空）：`, '控制台人工终止');
      if (why === null) return;
      const r = await post('/api/cancel?ws=' + encodeURIComponent(curWs), { node, reason: why || '控制台人工终止' });
      toast(r.ok ? `已终止 ${node}` : `失败：${r.error}`);
    } else if (kind === 'resume') {
      if (!confirm(`从断点续跑「${node}」？\n\n会自动注入最新存档（QUEST_RESUME_FROM）。若该任务不可断点续跑，等于重跑一遍。`)) return;
      const r = await post('/api/resume?ws=' + encodeURIComponent(curWs), { node });
      toast(r.ok ? `已续跑：${(r.resumed || []).join('、')}` : `失败：${r.error}`);
    }
    await loadTasks();
  } catch (e) { toast('操作失败：' + (e.message || e)); }
}

async function loadGate() {
  try {
    const d = await api('/api/gate/list');
    const night = d.night?.active ? `🌙 夜间自批中 · 剩余额度 ${d.night.quotaLeft}/${d.night.quota}` : '☀️ 白天模式（夜间窗口自批）';
    const np = (d.pending || []).length;
    if ($('#gateN')) $('#gateN').textContent = np ? np : '';
    if ($('#gateTop')) $('#gateTop').style.display = np ? 'inline-block' : 'none';
    if ($('#gate')) $('#gate').style.display = np ? 'block' : 'none';
    const items = (d.pending || []).map((g) => `<div class="gate-item">
      <b class="mono">${esc(g.id)}</b> <span class="mut">${new Date(g.createdAt).toLocaleString('zh-CN',{hour12:false})} · ${esc(g.why)}</span>
      <code>${esc(g.command)}</code>
      <div class="mut">AI 理由：${esc(g.reason || '（未给）')}</div>
      <div class="row" style="margin-top:8px">
        <button class="act" onclick="gateDecide('${esc(g.id)}',true)">放行</button>
        <button class="act danger" onclick="gateDecide('${esc(g.id)}',false)">作废</button>
      </div></div>`).join('');
    $('#gateBody').innerHTML = `<div class="row">${night}</div>` + (items || '<span class="mut">没有挂起的命令</span>');
  } catch (e) { $('#gateBody').innerHTML = `<span class="mut">读取失败：${esc(e.message)}</span>`; }
}
async function gateDecide(id, approve) {
  if (!confirm(approve ? `放行 ${id}？命令将立即执行。` : `作废 ${id}？命令从未执行过。`)) return;
  try { const r = await post('/api/gate/decide', { id, approve }); toast(r.ok ? (approve ? '已放行' : '已作废') : ('失败：' + r.error)); }
  catch (e) { toast('失败：' + e.message); }
  loadGate();
}

function fillLogNodes() {
  const sel = $('#logNode');
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = nodesCache.map((n) => `<option value="${esc(n.id)}">${esc(n.id)} · ${esc(n.status)}</option>`).join('');
  if (cur) sel.value = cur;
}
function openLog(node) {
  document.querySelectorAll('nav button').forEach((x) => x.classList.remove('on'));
  document.querySelectorAll('section').forEach((x) => x.classList.remove('on'));
  document.querySelector('nav button[data-t="logs"]').classList.add('on');
  $('#logs').classList.add('on');
  fillLogNodes();
  $('#logNode').value = node;
  loadLog();
}
async function loadLog() {
  const node = $('#logNode').value;
  if (!node) return;
  try {
    const d = await api('/api/log?ws=' + encodeURIComponent(curWs) + '&node=' + encodeURIComponent(node) + '&tail=60000');
    const text = d.log || '(空)';
    $('#logText').textContent = text;
    $('#logMeta').textContent = (d.file || '').split(/[\\/]/).pop() + ' · ' + text.length + ' 字符';
    drawSpark(text);
  } catch (e) { $('#logText').textContent = '读取失败：' + e.message; $('#sparkWrap').innerHTML = ''; }
}
// 从日志里抠 loss 序列画迷你曲线（数据来自任务自己打印的日志，不是模型猜测）
function drawSpark(text) {
  const vals = [...text.matchAll(/\b(?:val_)?loss\D{0,4}(\d+(?:\.\d+)?(?:e[+-]?\d+)?)/gi)]
    .map((m) => Number(m[1])).filter((v) => Number.isFinite(v) && v >= 0);
  if (vals.length < 3) { $('#sparkWrap').innerHTML = ''; return; }
  const W = 640, H = 90, pad = 6;
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const pts = vals.map((v, i) => {
    const x = pad + (W - 2*pad) * (i / (vals.length - 1));
    const y = pad + (H - 2*pad) * (1 - (v - min) / span);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  $('#sparkWrap').innerHTML = `<div class="mut" style="margin-bottom:4px">loss 曲线（${vals.length} 个采样 · ${min} → ${max}）</div>
    <svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      <rect x="0" y="0" width="${W}" height="${H}" fill="#0b0e12" rx="8"/>
      <polyline points="${pts}" fill="none" stroke="#4a9eff" stroke-width="1.6"/>
    </svg>`;
}

async function go(p) {
  p = (p || '').trim(); if (!p) return;
  $('#fpath').value = p; $('#viewer').innerHTML = '';
  try {
    const d = await api('/api/files?mode=list&path=' + encodeURIComponent(p));
    $('#flist').innerHTML = d.entries.map((e) => `<tr class="${e.dir ? 'dir' : ''}" onclick="clickE('${esc(e.name).replace(/'/g, "\\'")}', ${e.dir})">
      <td>${e.dir ? '📁' : '📄'} ${esc(e.name)}</td>
      <td class="mut">${e.dir ? '' : fmtSize(e.size)}</td>
      <td class="mut">${e.mtime ? new Date(e.mtime).toLocaleString('zh-CN',{hour12:false}) : ''}</td></tr>`).join('');
  } catch (e) { $('#flist').innerHTML = `<tr><td class="mut">${esc(e.message)}</td></tr>`; }
}
async function clickE(name, isDir) {
  const base = ($('#fpath').value || '').replace(/[\\/]+$/, '');
  const full = base + '\\' + name;
  if (isDir) return go(full);
  if (/\.(png|jpe?g|gif|webp)$/i.test(name)) {
    const d = await api('/api/files?mode=img&path=' + encodeURIComponent(full));
    $('#viewer').innerHTML = d.error ? `<pre>${esc(d.error)}</pre>` : `<img src="${d.dataUrl}" style="max-width:100%;border-radius:8px">`;
    return;
  }
  const d = await api('/api/files?mode=read&path=' + encodeURIComponent(full));
  $('#viewer').innerHTML = `<div class="mut">${esc(name)}${d.truncated ? '（已截尾）' : ''}</div><pre>${esc(d.text)}</pre>`;
}

// ── 实时：长轮询 /api/events（事件驱动，替代固定 10 秒刷新）──
let lastEvt = '';
async function pump() {
  for (;;) {
    try {
      const d = await api('/api/events?since=' + encodeURIComponent(lastEvt) + '&wait=25');
      const evs = d.events || [];
      if (evs.length) {
        lastEvt = evs[evs.length - 1].at || lastEvt;
        $('#live').style.color = 'var(--ok)';
        await loadTasks();
        loadGate();
        if ($('#logs').classList.contains('on') && $('#logAuto').checked) loadLog();
      }
    } catch { $('#live').style.color = 'var(--bad)'; await new Promise((r) => setTimeout(r, 4000)); }
  }
}
async function refreshAll() {
  try { await loadWs(); await loadTasks(); fillLogNodes(); loadGate(); toast('已刷新'); }
  catch (e) { toast('刷新失败：' + e.message); }
}
loadWs().then(() => { loadTasks(); fillLogNodes(); pump(); });
// 运行中的"已跑 X分Y秒"要自己走动；同时兜住长轮询万一断线时的刷新
setInterval(() => {
  if (!lastStatus || !$('#tasks')) return;
  // 路线图/追踪/正在跑现在都在「任务线」这一个页里，卡片直接重画（路线图只画 plan 节点，开销很小）
  if ($('#tasks').classList.contains('on')) { renderTracker(lastStatus); renderRunning(lastStatus); renderRoute(lastStatus); }
}, 5000);
setInterval(() => { if ($('#logs').classList.contains('on') && $('#logAuto').checked) loadLog(); }, 8000);
</script>
